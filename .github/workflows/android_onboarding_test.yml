name: Android Onboarding Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'app/src/androidTest/java/org/wikipedia/tests/OnboardingTest.kt'
      - 'app/src/androidTest/java/org/wikipedia/robots/feature/OnboardingRobot.kt'
      - '.github/workflows/android_onboarding_test.yml'
  pull_request:
    paths:
      - 'app/src/androidTest/java/org/wikipedia/tests/OnboardingTest.kt'
      - 'app/src/androidTest/java/org/wikipedia/robots/feature/OnboardingRobot.kt'

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false -Dkotlin.incremental=false"

jobs:
  onboarding-tests:
    name: Run Onboarding Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK and test APK
        run: |
          ./gradlew assembleDevDebug assembleDevDebugAndroidTest --no-daemon --stacktrace

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api-31-${{ runner.os }}

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          profile: pixel_6
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "Generated AVD snapshot for caching."

      - name: Run Onboarding Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          profile: pixel_6
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            # Wait for emulator to be fully ready
            adb wait-for-device
            adb shell settings put global window_animation_scale 0.0
            adb shell settings put global transition_animation_scale 0.0
            adb shell settings put global animator_duration_scale 0.0
            
            # Clear any previous allure results on device
            adb shell rm -rf /sdcard/allure-results || true
            
            # Run only OnboardingTest
            ./gradlew connectedDevDebugAndroidTest \
              --no-daemon \
              --stacktrace \
              -Pandroid.testInstrumentationRunnerArguments.class=org.wikipedia.tests.OnboardingTest \
              || true  # Continue even if tests fail to capture results

      - name: Pull Allure results from device
        if: always()
        run: |
          mkdir -p allure-results
          
          # Pull results from device sdcard
          adb pull /sdcard/allure-results ./allure-results/ || echo "No results on sdcard"
          
          # Also check app-specific directories
          PACKAGE_NAME="org.wikipedia.dev.test"
          adb pull /data/data/$PACKAGE_NAME/files/allure-results ./allure-results/ 2>/dev/null || echo "No results in app files"
          
          # Check for results in the build directory as well
          if [ -d "app/build/outputs/allure-results" ]; then
            cp -r app/build/outputs/allure-results/* ./allure-results/ 2>/dev/null || true
          fi
          
          # List what we found
          echo "=== Allure Results Found ==="
          find ./allure-results -type f -name "*.json" | head -20 || echo "No JSON files found"
          ls -la ./allure-results/ || echo "Directory empty or not found"

      - name: Copy test results for Allure report
        if: always()
        run: |
          # Ensure build directory has the results for Gradle Allure plugin
          mkdir -p app/build/allure-results
          
          # Handle nested directory structure
          if [ -d "allure-results/allure-results" ]; then
            cp -r allure-results/allure-results/* app/build/allure-results/ 2>/dev/null || true
          fi
          
          # Copy from root allure-results
          cp -r allure-results/*.json app/build/allure-results/ 2>/dev/null || true
          
          echo "=== Files in app/build/allure-results ==="
          ls -la app/build/allure-results/ || echo "Empty"

      - name: Generate Allure Report
        if: always()
        run: |
          # Download Allure commandline if not present and generate report
          ./gradlew downloadAllure allureReport --no-daemon || {
            echo "Gradle allure report failed, trying manual generation..."
            
            # Install Allure CLI manually as fallback
            curl -o allure-2.27.0.tgz -Ls https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
            tar -xzf allure-2.27.0.tgz
            
            # Generate report manually
            ./allure-2.27.0/bin/allure generate app/build/allure-results -o app/build/reports/allure-report --clean || echo "Manual generation also failed"
          }
          
          echo "=== Allure Report Generated ==="
          ls -la app/build/reports/allure-report/ || echo "Report directory not found"

      - name: Upload Allure Results (Raw)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: |
            allure-results/
            app/build/allure-results/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Allure HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: app/build/reports/allure-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Android Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Test APKs (for debugging)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-apks
          path: |
            app/build/outputs/apk/dev/debug/*.apk
            app/build/outputs/apk/androidTest/dev/debug/*.apk
          retention-days: 7

      - name: Test Summary
        if: always()
        run: |
          echo "## 🧪 Onboarding Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -d "app/build/reports/allure-report" ]; then
            echo "✅ Allure report generated successfully" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Download the **allure-report** artifact to view the detailed HTML report." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Allure report generation may have issues" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts Available:" >> $GITHUB_STEP_SUMMARY
          echo "- **allure-results**: Raw Allure JSON results" >> $GITHUB_STEP_SUMMARY
          echo "- **allure-report**: HTML report (open index.html)" >> $GITHUB_STEP_SUMMARY
          echo "- **android-test-results**: Standard Android test reports" >> $GITHUB_STEP_SUMMARY

