name: Android Onboarding Test CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false -Dkotlin.incremental=false"

jobs:
  instrumentation-tests:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v6
    
    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'
    
    - uses: gradle/gradle-build-action@v3

    - name: Run Instrumentation Tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        target: google_apis
        arch: arm64-v8a
        script: |
          adb wait-for-device
          
          # Install apps
          ./gradlew installDevDebug installDevDebugAndroidTest --no-daemon || exit 1
          
          # Wait for apps to be fully installed and ready
          sleep 10
          
          # Grant permissions (will fail on API 29 as POST_NOTIFICATIONS doesn't exist, but that's okay)
          adb shell pm grant org.wikipedia android.permission.POST_NOTIFICATIONS 2>/dev/null || true
          adb shell pm grant org.wikipedia.test android.permission.POST_NOTIFICATIONS 2>/dev/null || true
          
          # Run tests
          ./gradlew connectedDevDebugAndroidTest --no-daemon -P android.testInstrumentationRunnerArguments.class=org.wikipedia.tests.OnboardingTest || TEST_EXIT_CODE=$?
          
          # Pull Allure results from TestStorage (orchestrator)
          echo "📥 Pulling Allure results..."
          mkdir -p allure-results
          adb shell "test -d /sdcard/googletest/test_outputfiles/allure-results" 2>/dev/null && adb exec-out sh -c "cd /sdcard/googletest/test_outputfiles && tar cf - allure-results" 2>/dev/null | tar xvf - -C allure-results 2>/dev/null || echo "No results directory found"
          RESULT_COUNT=$(ls -1 allure-results 2>/dev/null | wc -l | tr -d ' ')
          if [ "$RESULT_COUNT" -gt 0 ]; then
            echo "✅ Pulled $RESULT_COUNT result files"
          else
            echo "⚠️  No Allure results found"
          fi
          
          # Exit with test result code
          if [ -n "${TEST_EXIT_CODE:-}" ]; then
            exit $TEST_EXIT_CODE
          fi

    - name: Generate Allure Report
      if: ${{ always() }}
      run: |
        if [ -d "allure-results" ] && [ "$(ls -A allure-results 2>/dev/null)" ]; then
          echo "📊 Generating Allure report..."
          ./gradlew :app:downloadAllure :app:allureReport --no-daemon --no-configuration-cache
          
          if [ -d "app/build/reports/allure-report/allureReport" ]; then
            cp -r app/build/reports/allure-report/allureReport allure-report
            tar -czf allure-report.tar.gz allure-report
            echo "✅ Report generated: allure-report/index.html"
          else
            echo "❌ Report generation failed"
            exit 1
          fi
        else
          echo "⚠️  No results to generate report from"
        fi

    - name: Upload Test Results
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: onboarding-test-results
        path: |
          allure-results/
          app/build/reports/androidTests/connected/**
        retention-days: 30

    - name: Upload Allure Report
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: allure-report-onboarding
        path: |
          allure-report.tar.gz
          allure-report/
        retention-days: 30
