name: Android Onboarding Test CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v6
    
    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'
    
    - uses: gradle/gradle-build-action@v3

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Create AVD and start emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 29
        arch: x86_64
        profile: Nexus 6
        disable-animations: true
        script: |
          echo "📱 Emulator ready"
          adb wait-for-device shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done'
          
          echo "📦 Installing apps..."
          ./gradlew installDevDebug installDevDebugAndroidTest --no-daemon
          sleep 5
          
          echo "🔐 Granting permissions..."
          adb shell pm grant org.wikipedia android.permission.POST_NOTIFICATIONS 2>/dev/null || true
          adb shell pm grant org.wikipedia.test android.permission.POST_NOTIFICATIONS 2>/dev/null || true
          
          echo "🧪 Running tests..."
          ./gradlew connectedDevDebugAndroidTest \
            --no-daemon \
            -P android.testInstrumentationRunnerArguments.class=org.wikipedia.tests.OnboardingTest || TEST_EXIT_CODE=$?
          
          echo "📥 Pulling Allure results..."
          mkdir -p allure-results
          if adb shell "test -d /sdcard/googletest/test_outputfiles/allure-results" 2>/dev/null; then
            adb exec-out sh -c "cd /sdcard/googletest/test_outputfiles && tar cf - allure-results" 2>/dev/null | \
              tar xf - -C allure-results 2>/dev/null || true
          fi
          
          if [ -n "$(ls -A allure-results 2>/dev/null)" ]; then
            echo "✅ Found $(ls -1 allure-results | wc -l) result files"
          else
            echo "⚠️  No results found"
          fi
          
          exit ${TEST_EXIT_CODE:-0}

    - name: Generate Allure Report
      if: always()
      run: |
        if [ -d "allure-results" ] && [ -n "$(ls -A allure-results 2>/dev/null)" ]; then
          echo "📊 Generating report..."
          ./gradlew :app:downloadAllure :app:allureReport --no-daemon --no-configuration-cache
          
          if [ -d "app/build/reports/allure-report/allureReport" ]; then
            cp -r app/build/reports/allure-report/allureReport allure-report
            tar -czf allure-report.tar.gz allure-report
            echo "✅ Report ready: allure-report/index.html"
          fi
        fi

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: test-results
        path: |
          allure-results/
          app/build/reports/androidTests/connected/**
        retention-days: 30

    - name: Upload Allure Report
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: allure-report
        path: |
          allure-report.tar.gz
          allure-report/
        retention-days: 30
        if-no-files-found: ignore
