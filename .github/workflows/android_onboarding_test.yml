name: Android Onboarding Test CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
  APP_ID: "org.wikipedia.dev"
  TEST_ID: "org.wikipedia.test"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle warm-up
        run: ./gradlew --version

      - name: Run instrumentation tests on emulator
        id: emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: >-
            -no-window
            -noaudio
            -no-boot-anim
            -gpu swiftshader_indirect
            -no-snapshot-save
          script: |
            set -euo pipefail

            echo "📱 Waiting for emulator boot..."
            adb wait-for-device
            adb shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 1; done'
            adb shell input keyevent 82 || true

            echo "🧹 Cleaning previous Allure results on device..."
            adb shell rm -rf /sdcard/allure-results \
                            /sdcard/Download/allure-results \
                            /sdcard/googletest/test_outputfiles/allure-results \
                            /sdcard/Android/data/*/files/allure-results || true

            echo "📦 Installing app + tests..."
            ./gradlew :app:installDevDebug :app:installDevDebugAndroidTest --no-daemon

            echo "🔐 Granting permissions (best-effort)..."
            adb shell pm grant "${APP_ID}" android.permission.POST_NOTIFICATIONS 2>/dev/null || true
            adb shell pm grant "${TEST_ID}" android.permission.POST_NOTIFICATIONS 2>/dev/null || true

            echo "🧪 Running tests..."
            set +e
            ./gradlew :app:connectedDevDebugAndroidTest \
              --no-daemon \
              --stacktrace \
              -Pandroid.testInstrumentationRunnerArguments.class=org.wikipedia.tests.OnboardingTest
            TEST_EXIT_CODE=$?
            set -e

            echo "📥 Pulling Allure results from device..."
            rm -rf allure-results
            mkdir -p allure-results

            RESULT_DIRS="$(adb shell '
              for d in \
                /sdcard/allure-results \
                /sdcard/Download/allure-results \
                /sdcard/googletest/test_outputfiles/allure-results
              do
                [ -d "$d" ] && echo "$d"
              done
              find /sdcard/Android/data -maxdepth 6 -type d -name allure-results 2>/dev/null | head -n 10
            ' | tr -d "\r")"

            if [ -n "$RESULT_DIRS" ]; then
              echo "$RESULT_DIRS" | while IFS= read -r d; do
                [ -z "$d" ] && continue
                echo "  ↳ Found: $d"
                tmp="$(mktemp -d)"
                adb exec-out sh -c "cd \"$(dirname "$d")\" && tar cf - \"$(basename "$d")\"" \
                  | tar xf - -C "$tmp" || true
                if [ -d "$tmp/allure-results" ]; then
                  cp -a "$tmp/allure-results/." allure-results/ || true
                fi
                rm -rf "$tmp" || true
              done
            else
              echo "⚠️  No Allure results directory found on device."
            fi

            RESULT_COUNT="$(ls -1 allure-results 2>/dev/null | wc -l | tr -d ' ')"
            if [ "${RESULT_COUNT}" -gt 0 ]; then
              echo "✅ Pulled ${RESULT_COUNT} Allure result files"
            else
              echo "⚠️  No Allure result files pulled"
            fi

            echo "exit_code=${TEST_EXIT_CODE}" >> "$GITHUB_OUTPUT"
            exit 0

      - name: Generate Allure Report
        if: always()
        run: |
          set -euo pipefail

          if [ -d "allure-results" ] && [ -n "$(ls -A allure-results 2>/dev/null)" ]; then
            echo "📊 Generating Allure report..."
            ./gradlew :app:downloadAllure :app:copyAllureResults :app:allureReport \
              --no-daemon \
              --no-configuration-cache \
              --stacktrace

            rm -rf allure-report
            mkdir -p allure-report

            if [ -d "app/build/reports/allure-report" ]; then
              cp -a "app/build/reports/allure-report/." allure-report/
            fi

            if [ -f "allure-report/index.html" ]; then
              tar -czf allure-report.tar.gz allure-report
              echo "✅ Allure report ready: allure-report/index.html"
            else
              echo "⚠️  Allure report not found after generation."
            fi
          else
            echo "⚠️  Skipping Allure report generation (no allure-results)."
          fi

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            allure-results/
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: |
            allure-report.tar.gz
            allure-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Fail job if tests failed
        if: always()
        run: |
          set -euo pipefail
          code="${{ steps.emulator.outputs.exit_code }}"
          if [ -z "${code}" ]; then
            echo "⚠️  No test exit code captured; failing for safety."
            exit 1
          fi
          if [ "${code}" != "0" ]; then
            echo "❌ Tests failed with exit code ${code}"
            exit 1
          fi
          echo "✅ Tests passed"
