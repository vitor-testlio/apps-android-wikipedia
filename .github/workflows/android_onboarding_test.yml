name: Android Onboarding Test CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - uses: gradle/gradle-build-action@v3

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare emulator test script
        shell: bash
        run: |
          cat > run-android-tests.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          echo "📱 Emulator ready"
          adb wait-for-device

          echo "⏳ Waiting for boot completion..."
          adb shell 'while [ -z "$(getprop sys.boot_completed)" ]; do sleep 1; done' || true
          adb shell input keyevent 82 || true

          echo "🧹 Cleaning previous Allure results on device..."
          adb shell "rm -rf /sdcard/googletest/test_outputfiles/allure-results" || true
          adb shell "rm -rf /sdcard/allure-results" || true
          adb shell "rm -rf /sdcard/Download/allure-results" || true

          echo "📦 Installing apps..."
          ./gradlew installDevDebug installDevDebugAndroidTest --no-daemon
          sleep 3

          echo "🔐 Granting permissions (best-effort)..."
          adb shell pm grant org.wikipedia android.permission.POST_NOTIFICATIONS 2>/dev/null || true
          adb shell pm grant org.wikipedia.dev android.permission.POST_NOTIFICATIONS 2>/dev/null || true
          adb shell pm grant org.wikipedia.test android.permission.POST_NOTIFICATIONS 2>/dev/null || true
          adb shell pm grant org.wikipedia.dev.test android.permission.POST_NOTIFICATIONS 2>/dev/null || true

          echo "🧪 Running tests..."
          TEST_EXIT_CODE=0
          ./gradlew connectedDevDebugAndroidTest \
            --no-daemon \
            --stacktrace \
            -Pandroid.testInstrumentationRunnerArguments.class=org.wikipedia.tests.OnboardingTest \
            || TEST_EXIT_CODE=$?

          echo "${TEST_EXIT_CODE}" > test-exit-code.txt
          echo "✅ Test exit code captured: ${TEST_EXIT_CODE}"

          echo "📥 Pulling Allure results..."
          rm -rf allure-results
          mkdir -p allure-results

          # 1) Primary path (your original)
          if adb shell "test -d /sdcard/googletest/test_outputfiles/allure-results" 2>/dev/null; then
            adb exec-out sh -c "cd /sdcard/googletest/test_outputfiles && tar cf - allure-results" \
              | tar xf - -C allure-results 2>/dev/null || true
          fi

          # 2) Common fallback paths
          if [ -z "$(ls -A allure-results 2>/dev/null || true)" ]; then
            if adb shell "test -d /sdcard/allure-results" 2>/dev/null; then
              adb exec-out sh -c "cd /sdcard && tar cf - allure-results" \
                | tar xf - -C allure-results 2>/dev/null || true
            fi
          fi

          if [ -z "$(ls -A allure-results 2>/dev/null || true)" ]; then
            if adb shell "test -d /sdcard/Download/allure-results" 2>/dev/null; then
              adb exec-out sh -c "cd /sdcard/Download && tar cf - allure-results" \
                | tar xf - -C allure-results 2>/dev/null || true
            fi
          fi

          # Flatten nested allure-results/allure-results if it happens
          if [ -d "allure-results/allure-results" ] && [ -n "$(ls -A allure-results/allure-results 2>/dev/null || true)" ]; then
            cp -a allure-results/allure-results/. allure-results/ || true
            rm -rf allure-results/allure-results || true
          fi

          RESULT_COUNT="$(ls -1 allure-results 2>/dev/null | wc -l | tr -d ' ')"
          if [ "${RESULT_COUNT}" -gt 0 ]; then
            echo "✅ Found ${RESULT_COUNT} result files"
          else
            echo "⚠️  No results found"
          fi

          # Keep this step green; fail later after uploading artifacts/report
          exit 0
          EOF

          chmod +x run-android-tests.sh

      - name: Create AVD and start emulator
        id: emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          script: |
            ./run-android-tests.sh

      - name: Generate Allure Report
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "allure-results" ] && [ -n "$(ls -A allure-results 2>/dev/null)" ]; then
            echo "📊 Generating report..."
            ./gradlew :app:downloadAllure :app:copyAllureResults :app:allureReport \
              --no-daemon \
              --no-configuration-cache \
              --stacktrace

            if [ -d "app/build/reports/allure-report" ]; then
              rm -rf allure-report
              cp -r app/build/reports/allure-report allure-report
              tar -czf allure-report.tar.gz allure-report
              echo "✅ Report ready: allure-report/index.html"
            else
              echo "⚠️  Allure report directory not found"
            fi
          else
            echo "⚠️  No allure-results; skipping report generation"
          fi

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: |
            test-exit-code.txt
            allure-results/
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: allure-report
          path: |
            allure-report.tar.gz
            allure-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Fail job if tests failed
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f test-exit-code.txt ]; then
            echo "⚠️  No test exit code captured; failing for safety."
            exit 1
          fi

          code="$(tr -d '[:space:]' < test-exit-code.txt || true)"
          if [ -z "${code}" ]; then
            echo "⚠️  Empty test exit code; failing for safety."
            exit 1
          fi

          if [ "${code}" != "0" ]; then
            echo "❌ Tests failed with exit code ${code}"
            exit "${code}"
          fi

          echo "✅ Tests passed"
